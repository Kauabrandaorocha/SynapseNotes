services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapsenotes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha_forte}
      POSTGRES_DB: ${POSTGRES_DB:-notes_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notes} -d ${POSTGRES_DB:-notes_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: synapsenotes-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
      DEFAULT_REGION: ${AWS_REGION:-sa-east-1}
    volumes:
      - localstack_data:/var/lib/localstack

volumes:
  postgres_data:
    driver: local
  localstack_data:
    driver: local
